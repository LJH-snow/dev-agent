<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dev-agent</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --user-bg: #1a1a1a;
      --user-fg: #ffffff;
      --assistant-bg: #f5f5f5;
      --tool-bg: #eef2ff;
      --tool-fg: #3730a3;
      --error-bg: #fef2f2;
      --error-fg: #991b1b;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #e5e5e5;
        --muted: #9ca3af;
        --border: #2a2a2a;
        --user-bg: #e5e5e5;
        --user-fg: #111111;
        --assistant-bg: #1c1c1c;
        --tool-bg: #1e1b3a;
        --tool-fg: #a5b4fc;
        --error-bg: #2a1414;
        --error-fg: #fca5a5;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .status { font-weight: 400; font-size: 12px; color: var(--muted); }
    header .header-status { display: flex; align-items: center; gap: 12px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 760px; width: 100%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-fg); padding: 10px 14px; border-radius: 16px; font-size: 14px; }
    .msg.assistant { align-self: flex-start; background: var(--assistant-bg); padding: 10px 14px; border-radius: 16px; font-size: 14px; }
    .msg.tool { align-self: flex-start; background: var(--tool-bg); color: var(--tool-fg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 8px 12px; border-radius: 10px; }
    .msg.error { align-self: center; background: var(--error-bg); color: var(--error-fg); font-size: 13px; padding: 8px 12px; border-radius: 10px; }
    .msg.denied { align-self: center; background: var(--error-bg); color: var(--error-fg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 6px 10px; border-radius: 8px; }
    .msg.approval { align-self: flex-start; background: var(--tool-bg); color: var(--tool-fg); font-size: 13px; padding: 10px 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; width: 100%; }
    .msg.approval .actions { display: flex; gap: 8px; }
    .composer {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: var(--bg);
      color: var(--fg);
      max-height: 160px;
      min-height: 40px;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    select { border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 12px; padding: 4px 6px; border-radius: 6px; max-width: 170px; }
    #new-session { border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 12px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .empty { color: var(--muted); font-size: 14px; align-self: center; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <span>dev-agent</span>
    <div class="header-status">
      <select id="session" title="Session"></select>
      <button type="button" id="new-session" title="New session">+</button>
      <button type="button" id="delete-session" title="Delete session">Delete</button>
      <span class="status" id="usage"></span>
      <span class="status" id="status">idle</span>
    </div>
  </header>
  <div id="messages"><div class="empty">Ask dev-agent anything. Tools run in your working directory.</div></div>
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Type a message — Enter to send, Shift+Enter for a new line"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const usage = document.getElementById("usage");
    const sessionSelect = document.getElementById("session");
    const newSessionButton = document.getElementById("new-session");
    const deleteSessionButton = document.getElementById("delete-session");

    let currentAssistant = null;
    let totalTokens = 0;
    let currentSessionId = null;

    function setStatus(text) { status.textContent = text; }

    function ensureSessionOption(sessionId) {
      const known = Array.from(sessionSelect.options).some((option) => option.value === sessionId);
      if (!known) {
        const option = document.createElement("option");
        option.value = sessionId;
        option.textContent = sessionId;
        sessionSelect.appendChild(option);
      }
      sessionSelect.value = sessionId;
    }

    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        if (!res.ok) return;
        const data = await res.json();
        sessionSelect.innerHTML = "";
        for (const session of data.sessions ?? []) {
          const option = document.createElement("option");
          option.value = session.sessionId;
          option.textContent = session.entryCount
            ? session.sessionId + " (" + session.entryCount + ")"
            : session.sessionId;
          sessionSelect.appendChild(option);
        }
        if (currentSessionId === null) {
          currentSessionId = data.activeSessionId ?? "desktop-default";
        }
        ensureSessionOption(currentSessionId);
      } catch {
        // The session picker is optional; keep the current conversation usable.
      }
    }

    async function loadHistory(sessionId) {
      messages.innerHTML = "";
      currentAssistant = null;
      try {
        const res = await fetch("/api/sessions/" + encodeURIComponent(sessionId) + "/messages");
        const data = await res.json();
        const history = data.messages ?? [];
        if (history.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Ask dev-agent anything. Tools run in your working directory.";
          messages.appendChild(empty);
          return;
        }
        for (const entry of history) {
          if (entry.role === "user") appendMessage("user", entry.content);
          else if (entry.role === "assistant" && entry.content) appendMessage("assistant", entry.content);
          else if (entry.role === "tool") appendMessage("tool", entry.content);
        }
      } catch {
        // Leave the transcript empty rather than blocking the UI.
      }
    }

    function appendMessage(kind, text) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function ensureAssistant() {
      if (!currentAssistant) {
        currentAssistant = appendMessage("assistant", "");
      }
      return currentAssistant;
    }

    function appendApprovalRequest(request) {
      const div = document.createElement("div");
      div.className = "msg approval";
      const label = document.createElement("div");
      label.textContent = "Approve " + request.tool + (request.reason ? ": " + request.reason : "");
      const actions = document.createElement("div");
      actions.className = "actions";
      const allow = document.createElement("button");
      allow.type = "button";
      allow.textContent = "Allow";
      const deny = document.createElement("button");
      deny.type = "button";
      deny.textContent = "Deny";

      const decide = async (decision) => {
        allow.disabled = true;
        deny.disabled = true;
        label.textContent = label.textContent + " — " + decision;
        try {
          await fetch("/api/approval", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ id: request.id, decision }),
          });
        } catch {
          label.textContent = label.textContent + " (failed to send)";
        }
      };

      allow.addEventListener("click", () => decide("allow"));
      deny.addEventListener("click", () => decide("deny"));
      actions.append(allow, deny);
      div.append(label, actions);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    sessionSelect.addEventListener("change", async () => {
      currentSessionId = sessionSelect.value;
      totalTokens = 0;
      usage.textContent = "";
      await loadHistory(currentSessionId);
      setStatus("session " + currentSessionId);
    });

    newSessionButton.addEventListener("click", async () => {
      currentSessionId = "session-" + Date.now().toString(36);
      ensureSessionOption(currentSessionId);
      totalTokens = 0;
      usage.textContent = "";
      await loadHistory(currentSessionId);
      setStatus("new session");
    });

    deleteSessionButton.addEventListener("click", async () => {
      if (currentSessionId === null) return;
      if (!window.confirm("Delete session " + currentSessionId + "?")) return;
      try {
        const res = await fetch("/api/sessions/" + encodeURIComponent(currentSessionId), {
          method: "DELETE",
        });
        if (!res.ok) {
          setStatus("delete failed");
          return;
        }
      } catch {
        setStatus("delete failed");
        return;
      }
      currentSessionId = null;
      totalTokens = 0;
      usage.textContent = "";
      await loadSessions();
      await loadHistory(currentSessionId);
      setStatus("session deleted");
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";
      input.style.height = "auto";
      send.disabled = true;
      setStatus("streaming");
      currentAssistant = null;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ message, sessionId: currentSessionId }),
        });
        if (!res.ok || !res.body) {
          const text = await res.text().catch(() => "");
          appendMessage("error", "Request failed: " + (text || res.status));
          setStatus("error");
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n\n")) >= 0) {
            const block = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            handleEvent(block);
          }
        }
      } catch (err) {
        appendMessage("error", err instanceof Error ? err.message : String(err));
        setStatus("error");
      } finally {
        send.disabled = false;
        currentAssistant = null;
        setStatus("idle");
      }
    });

    function handleEvent(block) {
      let eventType = "message";
      let data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event: ")) eventType = line.slice(7).trim();
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (!data) return;
      let parsed;
      try { parsed = JSON.parse(data); } catch { return; }

      switch (eventType) {
        case "token":
          ensureAssistant().textContent += parsed.token;
          messages.scrollTop = messages.scrollHeight;
          break;
        case "tool":
          appendMessage("tool", "▶ " + parsed.name + (parsed.input != null ? " " + JSON.stringify(parsed.input) : ""));
          break;
        case "tool-result":
          appendMessage("tool", "◀ " + parsed.name + ": " + summarize(parsed.output));
          break;
        case "turn":
          setStatus("turn " + parsed.turn);
          break;
        case "usage":
          totalTokens += Number(parsed.totalTokens) || 0;
          usage.textContent = totalTokens + " tokens";
          break;
        case "approval":
          if (parsed.decision === "deny") {
            appendMessage(
              "denied",
              "[denied] " + parsed.tool + (parsed.reason ? ": " + parsed.reason : "")
            );
          }
          break;
        case "approval-request":
          appendApprovalRequest(parsed);
          break;
        case "error":
          appendMessage("error", parsed.message || "unknown error");
          break;
        case "done":
          setStatus("done · " + parsed.turns + " turn(s)");
          loadSessions();
          break;
      }
    }

    function summarize(output) {
      if (typeof output !== "string") return JSON.stringify(output);
      return output.length > 120 ? output.slice(0, 117) + "..." : output;
    }

    loadSessions().then(() => loadHistory(currentSessionId));
  </script>
</body>
</html>
